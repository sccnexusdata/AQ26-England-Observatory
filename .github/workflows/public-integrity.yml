name: AQ26 Public Release Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aq26-public-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-repository:
    name: Verify closed-world release and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Compile validator and tests
        run: python -m compileall -q scripts tests

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate public repository boundary
        run: python scripts/validate_public_repository.py
